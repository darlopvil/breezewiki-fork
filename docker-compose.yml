services:
  breezewiki:
    container_name: breezewiki_app
    image: quay.io/pussthecatorg/breezewiki:latest
    restart: unless-stopped
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - ./config.ini:/app/config.ini
      - ./src:/app/src
      - ./lib:/app/lib
      - ./static/fandom-skin.css:/app/static/fandom-skin.css
      - ./static/bw-custom.css:/app/static/bw-custom.css
      - ./static/fandom-mainpage.css:/app/static/fandom-mainpage.css
    networks:
      - nginx-proxy-manager_default

networks:
  nginx-proxy-manager_default:
    external: true

